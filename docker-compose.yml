# Modified for the 2026 modernization; see NOTICE and CHANGELOG.md.
name: zero-trust-search

x-admin-task: &admin-task
  image: node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
  profiles: [tools]
  user: node
  working_dir: /workspace
  entrypoint: [node]
  environment:
    SOLR_URL: http://solr:8983/solr
    SOLR_COLLECTION: BigData
  volumes:
    - ./scripts:/workspace/scripts:ro
    - ./solr:/workspace/solr:ro
    - ./samples:/workspace/samples:ro
  networks: [backend]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    solr:
      condition: service_healthy

services:
  web:
    build:
      context: ./dataapp
      target: runtime
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env or run bash run.sh}
      SOLR_URL: http://solr:8983/solr
      SOLR_COLLECTION: BigData
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [frontend, backend]
    depends_on:
      solr:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  solr:
    image: solr:9.11.0-slim@sha256:3b70e899b1cca19729c49c110a1aa8e937f727be4cca3ad07ea67f151f5cc07d
    environment:
      ZK_HOST: zookeeper:2181
      SOLR_HEAP: ${SOLR_HEAP:-512m}
      SOLR_HOST: solr
    volumes:
      - solr_data_v2:/var/solr
    networks: [backend]
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", "http://localhost:8983/solr/admin/info/system?wt=json"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  zookeeper:
    image: zookeeper:3.9.6@sha256:5bad433c71701a1d788b4df86c921d91bfb65c23a1443bcb18a80f40373ae9d9
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok,srvr,mntr
      ZOO_AUTOPURGE_PURGEINTERVAL: 24
      ZOO_ADMINSERVER_ENABLED: "false"
    volumes:
      - zookeeper_data_v2:/data
      - zookeeper_log_v2:/datalog
    networks: [backend]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, zkServer.sh, status]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  bootstrap:
    <<: *admin-task
    command: [scripts/bootstrap-solr.mjs]

  import-sample:
    <<: *admin-task
    command: [scripts/import-sample.mjs]

networks:
  frontend:
  backend:
    internal: true

volumes:
  solr_data_v2:
  zookeeper_data_v2:
  zookeeper_log_v2:
