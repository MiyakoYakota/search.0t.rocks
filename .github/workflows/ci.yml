name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        working-directory: dataapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dataapp/package-lock.json
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Typecheck, regression tests and production build
        run: npm run check
      - name: Check known dependency advisories
        run: npm audit --audit-level=high

  integration:
    name: Container integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: search-ci
      API_TOKEN: ci-only-synthetic-test-token-0000000000000000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate shell entry point
        run: bash -n run.sh
      - name: Test bootstrap and import validation
        run: node --test scripts/*.test.mjs
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and exercise a synthetic collection
        run: |
          bash run.sh --sample
          docker compose run --rm bootstrap
          node scripts/smoke.mjs
          docker compose up -d --force-recreate --wait --wait-timeout 180 zookeeper solr
          docker compose up -d --wait --wait-timeout 120 web
          node scripts/smoke.mjs
      - name: Diagnostic service logs
        if: failure()
        run: docker compose logs --no-color --tail=80
      - name: Stop isolated CI services
        if: always()
        run: docker compose down --remove-orphans
